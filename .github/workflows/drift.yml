# Put this at .github/workflows/drift.yml in your PROFILE repo (juwwad/juwwad)
# next to drift.mjs in the repo root.
name: Generate drift animation

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch: # lets you run it manually the first time
  push:
    branches: [main]
    paths: [drift.mjs, .github/workflows/drift.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG
        run: node drift.mjs --user "${{ github.repository_owner }}" --out dist/drift.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drift.svg
          git commit -q -m "update drift animation"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
